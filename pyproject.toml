[project]
name = "youtube-translator-desktop"
version = "0.1.0"
description = "Desktop app that downloads YouTube subtitles and converts them to Markdown."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bgutil-ytdlp-pot-provider>=1.3.2",
    "fastapi>=0.115.0",
    "openai>=1.99.0",
    "PySide6>=6.7.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "yt-dlp-ejs>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
